[package]
name = "anthropic-client-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Full-featured Rust client for the Anthropic Messages API — streaming SSE, tool use, extended thinking, prompt caching, auto-retry, token counting. Compatible with Claude, MiniMax, DeepSeek."
license = "Apache-2.0"
repository = "https://github.com/kandada/anthropic-rs"
homepage = "https://github.com/kandada/anthropic-rs"
documentation = "https://docs.rs/anthropic-client-rs"
readme = "README.md"
authors = ["xiefujin <490021684@qq.com>"]
keywords = ["anthropic", "claude", "llm", "chat", "ai"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]

[workspace]

[features]
default = ["async"]
async = ["dep:reqwest", "dep:tokio", "dep:futures", "dep:bytes"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
